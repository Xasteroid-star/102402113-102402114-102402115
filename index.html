<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>首页 · 拾回</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stage">
  <div class="phone">
   <div class="statusbar"><span id="status-time">9:41</span><span class="dot"></span></div>

    <div class="homehead">
      <div class="logo">🍀</div>
      <div><div class="hname">拾回</div><div class="hsub">校园失物招领</div></div>
    </div>

    <a class="searchbar" href="search.html"><span class="g"></span><span>搜索物品，如 校园卡、钥匙</span></a>

    <div style="padding:2px 16px 0">
      <div class="seg" id="typeSeg">
        <button class="on" data-type="">全部</button>
        <button data-type="lost">寻物</button>
        <button data-type="found">招领</button>
      </div>
    </div>

    <div class="filters">
      <span class="chip on" data-sort="newest">最新发布</span>
      <span class="sort">⌄</span>
    </div>

    <div class="list" id="list">
      <!-- TODO(B): 首页信息流 —— API.list({type, sort}) 拉取进行中条目，UI.itemCard 渲染 -->
      <div class="empty"><div class="empty-ico">🍀</div><div class="empty-title">加载中…</div></div>
    </div>

    <nav class="tabbar">
      <a class="t on" href="index.html"><span class="ic">⌂</span><span class="lb">首页</span></a>
      <a class="t" href="search.html"><span class="ic">⌕</span><span class="lb">搜索</span></a>
      <a class="fab" href="publish.html">＋</a>
      <a class="t" href="my.html"><span class="ic">◉</span><span class="lb">我的</span></a>
    </nav>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/seed.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  // 首页逻辑：筛选 Tab 切换 + 信息流渲染
  (function () {
    var listEl = document.getElementById('list');
    var typeSeg = document.getElementById('typeSeg');
    var currentType = '';   // '' 全部 | 'lost' 寻物 | 'found' 招领

    function render() {
      listEl.innerHTML = '<div class="empty"><div class="empty-ico">🍀</div><div class="empty-title">加载中…</div></div>';
      API.list({ type: currentType, sort: 'newest' })
        .then(function (items) {
          if (!items.length) {
            listEl.innerHTML = '<div class="empty"><div class="empty-ico">🍀</div><div class="empty-title">暂无相关信息</div><div class="empty-sub">发布一条寻物或招领信息吧</div></div>';
            return;
          }
          // 注意：这里不能写 items.map(UI.itemCard) —— map 会把数组下标当作
          // itemCard 的第二个参数 keyword 传进去，导致标题里的数字被高亮，
          // 甚至劈开 HTML 实体（&#39; → &#3<mark>9</mark>;）把转义字符显示给用户。
          listEl.innerHTML = items.map(function (it) { return UI.itemCard(it); }).join('');
        })
        .catch(function (e) {
          listEl.innerHTML = '<div class="empty"><div class="empty-ico">⚠️</div><div class="empty-title">加载失败</div><div class="empty-sub">' + Core.escapeHtml(e.message) + '</div></div>';
        });
    }

    typeSeg.querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        typeSeg.querySelectorAll('button').forEach(function (b) { b.classList.remove('on'); });
        btn.classList.add('on');
        currentType = btn.dataset.type || '';
        render();
      });
    });

    render();
  })();
</script>

<script>
  // 实时更新状态栏时间
  (function updateStatusTime() {
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, '0');
    var mm = String(now.getMinutes()).padStart(2, '0');
    var timeStr = hh + ':' + mm;
    var timeEl = document.getElementById('status-time');
    if (timeEl) timeEl.textContent = timeStr;
    setTimeout(updateStatusTime, 60000);
  })();
</script>

</body>
</html>
