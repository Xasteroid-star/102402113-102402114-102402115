<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的发布 · 拾回</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="statusbar"><span id="status-time">9:41</span><span class="dot"></span></div>

    <div class="navbar"><div class="sp"></div><div class="title">我的发布</div><div class="sp"></div></div>

    <div class="mehead">
      <div class="av" id="myAv">拾</div>
      <div><div class="nm" id="myName">匿名用户</div><div class="sc" id="mySub">本机发布 · 校园失物招领</div></div>
    </div>

    <div class="stats">
      <div class="s"><b id="statPublish">0</b><span>我发布的</span></div>
      <div class="s"><b id="statResolved">0</b><span>已解决</span></div>
      <div class="s"><b id="statFav">0</b><span>我的收藏</span></div>
    </div>

    <div style="padding:2px 16px 0">
      <div class="seg" id="mySeg">
        <button class="on" data-type="">全部</button>
        <button data-type="lost">寻物</button>
        <button data-type="found">招领</button>
        <button data-type="resolved">已解决</button>
      </div>
    </div>

    <div class="list" id="myList" style="margin-top:12px"></div>

    <nav class="tabbar">
      <a class="t" href="index.html"><span class="ic">⌂</span><span class="lb">首页</span></a>
      <a class="t" href="search.html"><span class="ic">⌕</span><span class="lb">搜索</span></a>
      <a class="fab" href="publish.html">＋</a>
      <a class="t on" href="my.html"><span class="ic">◉</span><span class="lb">我的</span></a>
    </nav>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  // 我的发布：统计 + 筛选 + 标记已找到/已归还（自动下架）
  (function () {
    var listEl = document.getElementById('myList');
    var seg = document.getElementById('mySeg');
    var myUid = UI.uid();
    var allItems = [];
    var currentType = '';   // '' 全部 | 'lost' | 'found' | 'resolved'

    function getFavs() { try { return JSON.parse(localStorage.getItem('favorites') || '[]'); } catch (e) { return []; } }

    function load() {
      // 本机发布的（publisher=uid）+ 种子里的示例数据（publisher=demo）
      Promise.all([
        API.list({ publisher: myUid, status: 'all' }),
        API.list({ publisher: 'demo', status: 'all' })
      ]).then(function (res) {
        allItems = res[0].concat(res[1]);
        renderStats();
        renderList();
      }).catch(function () {
        listEl.innerHTML = '<div class="empty"><div class="empty-ico">⚠️</div><div class="empty-title">加载失败</div></div>';
      });
    }

    function renderStats() {
      document.getElementById('statPublish').textContent = allItems.length;
      document.getElementById('statResolved').textContent = allItems.filter(function (it) { return it.status === 'resolved'; }).length;
      document.getElementById('statFav').textContent = getFavs().length;
    }

    function myCard(item) {
      var typeTag = item.type === 'lost' ? '<span class="tag lost">寻物</span>' : '<span class="tag found">招领</span>';
      var secTag = item.status === 'resolved'
        ? '<span class="tag cat">已解决</span>'
        : '<span class="tag cat">' + Core.escapeHtml(item.category) + '</span>';
      var action = item.status === 'resolved'
        ? ''
        : '<button class="resolve-btn" data-id="' + item.id + '" data-type="' + item.type + '">标记' + Core.resolvedLabel(item.type) + '</button>';
      return (
        '<div class="card">' +
          '<div class="' + UI.thumbClass(item) + '">' + UI.categoryIcon(item.category) + '</div>' +
          '<div class="body">' +
            '<div class="top">' + typeTag + secTag + '</div>' +
            '<h3>' + Core.escapeHtml(item.title) + '</h3>' +
            '<div class="meta">' + Core.escapeHtml(item.location) + ' · ' + Core.escapeHtml(item.time) + '</div>' +
          '</div>' +
          action +
        '</div>'
      );
    }

    function renderList() {
      var items = allItems.filter(function (it) {
        if (currentType === 'lost' || currentType === 'found') return it.type === currentType;
        if (currentType === 'resolved') return it.status === 'resolved';
        return true;
      });
      if (!items.length) {
        listEl.innerHTML = '<div class="empty"><div class="empty-ico">📭</div><div class="empty-title">暂无相关发布</div><div class="empty-sub">去发布第一条信息吧</div></div>';
        return;
      }
      listEl.innerHTML = items.map(myCard).join('');
      listEl.querySelectorAll('.resolve-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.dataset.id;
          var label = Core.resolvedLabel(btn.dataset.type);
          API.resolve(id).then(function () {
            UI.toast('已标记为「' + label + '」');
            load();
          }).catch(function (e) { UI.toast(e.message); });
        });
      });
    }

    seg.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        seg.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        currentType = b.dataset.type || '';
        renderList();
      });
    });

    load();
  })();
</script>

<script>
  (function updateStatusTime() {
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, '0');
    var mm = String(now.getMinutes()).padStart(2, '0');
    var timeEl = document.getElementById('status-time');
    if (timeEl) timeEl.textContent = hh + ':' + mm;
    setTimeout(updateStatusTime, 60000);
  })();
</script>

</body>
</html>
