<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>详情 · 拾回</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="statusbar"><span id="status-time">9:41</span><span class="dot"></span></div>

    <div class="hero found" id="hero">
      <a class="back" href="javascript:history.back()">‹</a>
      <span id="heroIcon">🎫</span>
    </div>

    <div class="detail" id="detail">
      <div class="tags" id="detailTags"><span class="tag found">招领</span><span class="tag cat">证件卡类</span></div>
      <h2 id="detailTitle">加载中…</h2>
      <div class="kv">
        <div class="r"><span class="k">地点</span><span class="v" id="kvLocation">—</span></div>
        <div class="r"><span class="k">时间</span><span class="v" id="kvTime">—</span></div>
        <div class="r"><span class="k">联系</span><span class="v" id="kvContact">—</span></div>
        <div class="r"><span class="k">发布</span><span class="v" id="kvPublisher">—</span></div>
      </div>
      <div class="desc"><h4>物品描述</h4><p id="detailDesc">—</p></div>
      <div class="tip"><b>温馨提示：</b>请勿提前透露物品全部特征，以便核实失主身份。</div>
      <div class="publisher">
        <div class="av" id="publisherAv">拾</div>
        <div><div class="nm" id="publisherName">—</div><div class="sc" id="publisherSub">—</div></div>
        <div class="more">TA 的其他发布 ›</div>
      </div>
    </div>

    <div class="actbar">
      <div class="icon" id="favBtn"><span class="e">☆</span>收藏</div>
      <div class="icon" id="shareBtn"><span class="e">↗</span>分享</div>
      <button class="cta" id="contactBtn">联系 TA</button>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  // 详情页：填充数据 + 一键复制联系方式 + 收藏 + 分享
  (function () {
    var id = UI.query('id');
    var item = null;
    var favBtn = document.getElementById('favBtn');

    function getFavs() { try { return JSON.parse(localStorage.getItem('favorites') || '[]'); } catch (e) { return []; } }
    function setFavs(a) { localStorage.setItem('favorites', JSON.stringify(a)); }
    function isFav() { return getFavs().indexOf(id) !== -1; }
    function renderFav() { favBtn.querySelector('.e').textContent = isFav() ? '★' : '☆'; }

    if (!id) {
      document.getElementById('detailTitle').textContent = '缺少物品 id';
      return;
    }

    API.get(id).then(function (it) {
      item = it;
      document.getElementById('hero').className = 'hero ' + (it.type === 'lost' ? 'lost' : 'found');
      document.getElementById('heroIcon').textContent = UI.categoryIcon(it.category);
      var typeTag = it.type === 'lost' ? '<span class="tag lost">寻物</span>' : '<span class="tag found">招领</span>';
      var secTag = it.status === 'resolved' ? '<span class="tag cat">已解决</span>' : '<span class="tag cat">' + Core.escapeHtml(it.category) + '</span>';
      document.getElementById('detailTags').innerHTML = typeTag + secTag;
      document.getElementById('detailTitle').textContent = it.title;
      document.getElementById('kvLocation').textContent = it.location || '—';
      document.getElementById('kvTime').textContent = it.time || '—';
      document.getElementById('kvContact').textContent = it.contact || '—';
      document.getElementById('kvPublisher').textContent = (it.publisherName || '匿名用户') + ' · 发布';
      document.getElementById('detailDesc').textContent = it.description || '（无描述）';
      document.getElementById('publisherAv').textContent = (it.publisherName || '匿').charAt(0);
      document.getElementById('publisherName').textContent = it.publisherName || '匿名用户';
      document.getElementById('publisherSub').textContent = (it.dept ? it.dept + ' · ' : '') + '发布于 ' + (it.time || '');
      renderFav();
    }).catch(function (e) {
      document.getElementById('detailTitle').textContent = '加载失败';
      document.getElementById('detailDesc').textContent = e.message;
    });

    document.getElementById('contactBtn').addEventListener('click', function () {
      if (!item) return UI.toast('信息加载中…');
      if (!item.contact) return UI.toast('发布者未留下联系方式');
      UI.copyText(item.contact).then(function () {
        UI.toast('联系方式已复制：' + item.contact);
      }).catch(function () {
        UI.toast('复制失败，请手动复制：' + item.contact);
      });
    });

    favBtn.addEventListener('click', function () {
      var favs = getFavs();
      var idx = favs.indexOf(id);
      if (idx === -1) { favs.push(id); UI.toast('已收藏'); }
      else { favs.splice(idx, 1); UI.toast('已取消收藏'); }
      setFavs(favs);
      renderFav();
    });

    document.getElementById('shareBtn').addEventListener('click', function () {
      var url = location.href;
      if (navigator.share) {
        navigator.share({ title: (item && item.title) || '拾回', url: url }).catch(function () {});
      } else {
        UI.copyText(url).then(function () { UI.toast('链接已复制，去分享吧'); }).catch(function () { UI.toast('分享失败'); });
      }
    });
  })();
</script>

<script>
  (function updateStatusTime() {
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, '0');
    var mm = String(now.getMinutes()).padStart(2, '0');
    var timeEl = document.getElementById('status-time');
    if (timeEl) timeEl.textContent = hh + ':' + mm;
    setTimeout(updateStatusTime, 60000);
  })();
</script>

</body>
</html>
