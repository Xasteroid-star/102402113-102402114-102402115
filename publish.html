<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>发布信息 · 拾回</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="statusbar"><span id="status-time">9:41</span><span class="dot"></span></div>

    <div class="navbar"><a class="back" href="javascript:history.back()">‹</a><div class="title">发布信息</div><div class="sp"></div></div>

    <form class="form" id="publishForm" novalidate>
      <div class="field"><label>类型</label>
        <div class="seg" id="typeSwitch">
          <button type="button" class="alt2 on" data-type="lost">寻物</button>
          <button type="button" class="alt" data-type="found">招领</button>
        </div>
      </div>

      <div class="field"><label>物品照片 <span style="color:var(--faint);font-weight:400">（选填）</span></label>
        <div class="upload" id="uploadBtn"><span class="p">＋</span>添加照片</div>
      </div>

      <div class="field"><label>物品名称 <em>*</em></label>
        <input class="inp" name="title" placeholder="如：校园卡、宿舍钥匙">
        <span class="errmsg" id="err-title"></span>
      </div>

      <div class="field"><label>物品分类 <em>*</em></label>
        <div class="chips" id="categoryChips">
          <button type="button" class="c on" data-cat="证件卡类">证件卡类</button>
          <button type="button" class="c" data-cat="钥匙">钥匙</button>
          <button type="button" class="c" data-cat="雨伞">雨伞</button>
          <button type="button" class="c" data-cat="水杯">水杯</button>
          <button type="button" class="c" data-cat="耳机">耳机</button>
          <button type="button" class="c" data-cat="图书">图书</button>
          <button type="button" class="c" data-cat="其他">其他</button>
        </div>
      </div>

      <div class="field"><label>地点与时间 <em>*</em></label>
        <div class="row2">
          <input class="inp" name="location" placeholder="如：三教 201">
          <input class="inp" name="time" placeholder="如：10-02 09:30">
        </div>
        <span class="errmsg" id="err-loc"></span>
      </div>

      <div class="field"><label>详细描述 <span style="color:var(--faint);font-weight:400">（选填）</span></label>
        <textarea class="inp" name="description" placeholder="补充特征，如颜色、品牌、有无挂件…"></textarea>
      </div>

      <div class="field"><label>联系方式 <em>*</em></label>
        <input class="inp" name="contact" placeholder="微信号 / 手机号（仅详情页可见）">
        <span class="errmsg" id="err-contact"></span>
      </div>

      <button type="submit" class="submit">立即发布</button>
    </form>

    <div class="overlay" id="successOverlay">
      <div class="modal">
        <div class="ok">✓</div>
        <h3>发布成功</h3>
        <p>你的信息已发布成功<br>可在「我的发布」中查看和管理</p>
        <button class="btn" id="goMy">查看我的发布</button>
        <button class="btn ghost" id="goHome">返回首页</button>
      </div>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  // 发布页：类型/分类选择 + 前端校验 + 提交 + 成功弹层
  (function () {
    var form = document.getElementById('publishForm');
    var typeSwitch = document.getElementById('typeSwitch');
    var categoryChips = document.getElementById('categoryChips');
    var overlay = document.getElementById('successOverlay');
    var selectedType = 'lost';
    var selectedCategory = '证件卡类';

    typeSwitch.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        typeSwitch.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        selectedType = b.dataset.type;
      });
    });

    categoryChips.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        categoryChips.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        selectedCategory = b.dataset.cat;
      });
    });

    document.getElementById('uploadBtn').addEventListener('click', function () {
      UI.toast('照片为选填项，本演示暂不实现上传');
    });

    function clearErrors() {
      form.querySelectorAll('.inp.error').forEach(function (x) { x.classList.remove('error'); });
      form.querySelectorAll('.errmsg').forEach(function (x) { x.textContent = ''; });
    }

    function mark(name, slotId, msg) {
      var input = form.querySelector('[name="' + name + '"]');
      if (input) input.classList.add('error');
      var slot = document.getElementById(slotId);
      if (slot) slot.textContent = msg;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      clearErrors();
      var data = {
        type: selectedType,
        title: form.title.value,
        category: selectedCategory,
        location: form.location.value,
        time: form.time.value,
        description: form.description.value,
        contact: form.contact.value,
        publisher: UI.uid()
      };
      var v = Core.validatePublish(data);
      if (!v.ok) {
        if (v.errors.title) mark('title', 'err-title', v.errors.title);
        if (v.errors.location || v.errors.time) { mark('location', 'err-loc', '请填写地点和时间'); mark('time', 'err-loc', '请填写地点和时间'); }
        if (v.errors.contact) mark('contact', 'err-contact', v.errors.contact);
        if (v.errors.type) UI.toast(v.errors.type);
        if (v.errors.category) UI.toast(v.errors.category);
        return;
      }
      API.publish(data).then(function () {
        overlay.classList.add('on');
      }).catch(function (err) {
        UI.toast(err.message || '发布失败');
      });
    });

    document.getElementById('goMy').addEventListener('click', function () { location.href = 'my.html'; });
    document.getElementById('goHome').addEventListener('click', function () { location.href = 'index.html'; });
  })();
</script>

<script>
  (function updateStatusTime() {
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, '0');
    var mm = String(now.getMinutes()).padStart(2, '0');
    var timeEl = document.getElementById('status-time');
    if (timeEl) timeEl.textContent = hh + ':' + mm;
    setTimeout(updateStatusTime, 60000);
  })();
</script>

</body>
</html>
