<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>搜索 · 拾回</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="statusbar"><span id="status-time">9:41</span><span class="dot"></span></div>

    <div class="navbar"><a class="back" href="index.html">‹</a><div class="title">搜索</div><div class="sp"></div></div>

    <div class="searchinput">
      <span class="mg"></span>
      <input id="searchInput" placeholder="输入物品名称搜索">
      <span class="clr" id="searchClear">✕</span>
    </div>

    <div id="searchDefault" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
      <div class="block"><h4>搜索历史 <button id="clearHistory">清空</button></h4>
        <div class="chips" id="historyChips"></div>
      </div>
      <div class="block"><h4>热门搜索</h4></div>
      <div class="hot" id="hotList"></div>
    </div>

    <div id="searchResult" style="display:none;flex:1;flex-direction:column;overflow:hidden">
      <div class="resultmeta"><span id="resultMeta">找到 <b>0</b> 条相关信息</span><span>综合排序 ⌄</span></div>
      <div class="list" id="resultList" style="margin-top:12px"></div>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/seed.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  // 搜索页：关键词搜索 + 高亮 + 历史/热门 + 空状态
  (function () {
    var input = document.getElementById('searchInput');
    var defaultEl = document.getElementById('searchDefault');
    var resultEl = document.getElementById('searchResult');
    var historyChips = document.getElementById('historyChips');
    var hotList = document.getElementById('hotList');
    var resultMeta = document.getElementById('resultMeta');
    var resultList = document.getElementById('resultList');

    var HOT = ['校园卡', '宿舍钥匙', '雨伞', '蓝牙耳机', '水杯'];
    var searchToken = 0;   // 搜索竞态保护，见 doSearch

    function getHistory() { try { return JSON.parse(localStorage.getItem('searchHistory') || '[]'); } catch (e) { return []; } }
    function setHistory(a) { localStorage.setItem('searchHistory', JSON.stringify(a)); }

    function renderDefault() {
      var h = getHistory();
      historyChips.innerHTML = h.length
        ? h.map(function (k) { 
            return '<button class="c" data-kw="' + Core.escapeHtml(k) + '">' + 
                    Core.escapeHtml(k) + 
                    '<span class="del-history" data-del="' + Core.escapeHtml(k) + '" style="margin-left:6px;opacity:.5;font-size:10px;font-weight:bold;">✕</span>' + 
                  '</button>'; 
          }).join('')
        : '<span style="font-size:12px;color:var(--faint)">暂无搜索历史</span>';
      hotList.innerHTML = HOT.map(function (k, i) {
        var heat = i < 2 ? '<span class="heat">热</span>' : '';
        return '<div class="h" data-kw="' + Core.escapeHtml(k) + '"><span class="rk">' + (i + 1) + '</span><span class="nm">' + Core.escapeHtml(k) + '</span>' + heat + '<span class="act">搜索</span></div>';
      }).join('');
    }

    // 事件委托：监听器只绑一次，绑在「不会被重建」的父容器上。
    // renderDefault() 会反复重绘 chips / 热门行，若在渲染时逐个绑监听，
    // 一旦重绘就会整批丢失（历史 chips 每次重建、热门行少绑一次都会导致点击无反应）。
    historyChips.addEventListener('click', function (e) {
      var del = e.target.closest('.del-history');
      if (del) {                                   // 先判删除，它在 chip 内部
        e.stopPropagation();
        setHistory(getHistory().filter(function (k) { return k !== del.dataset.del; }));
        renderDefault();
        return;
      }
      var chip = e.target.closest('.c');
      if (chip) doSearch(chip.dataset.kw);
    });

    hotList.addEventListener('click', function (e) {
      var row = e.target.closest('.h');
      if (row) doSearch(row.dataset.kw);
    });

    function doSearch(kw) {
      kw = String(kw || '').trim();
      if (!kw) return;
      input.value = kw;
      var h = getHistory().filter(function (k) { return k !== kw; });
      h.unshift(kw);
      setHistory(h.slice(0, 10));

      defaultEl.style.display = 'none';
      resultEl.style.display = 'flex';
      resultList.innerHTML = '<div class="empty"><div class="empty-ico">🔍</div><div class="empty-title">搜索中…</div></div>';

      // 竞态保护：连续改关键词时，先发出的请求可能后返回，
      // 用 token 丢弃过期响应，避免结果被旧数据覆盖。
      var token = ++searchToken;
      API.list({ q: kw }).then(function (items) {
        if (token !== searchToken) return;
        resultMeta.innerHTML = '找到 <b>' + items.length + '</b> 条相关信息';
        if (!items.length) {
          resultList.innerHTML = '<div class="empty"><div class="empty-ico">🔍</div><div class="empty-title">未找到相关信息</div><div class="empty-sub">换个关键词试试，如「校园卡」「钥匙」</div></div>';
          return;
        }
        resultList.innerHTML = items.map(function (it) { return UI.itemCard(it, kw); }).join('');
      }).catch(function (e) {
        if (token !== searchToken) return;
        resultList.innerHTML = '<div class="empty"><div class="empty-ico">⚠️</div><div class="empty-title">搜索失败</div><div class="empty-sub">' + Core.escapeHtml(e.message) + '</div></div>';
      });
    }

    function showDefault() {
      input.value = '';
      defaultEl.style.display = 'flex';   // 与初始状态一致（内联样式是 display:flex），置空会退化成 block
      resultEl.style.display = 'none';
      renderDefault();
    }

    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(input.value); });
    document.getElementById('searchClear').addEventListener('click', showDefault);
    document.getElementById('clearHistory').addEventListener('click', function () { setHistory([]); renderDefault(); });

    renderDefault();
  })();
</script>


<script>
  (function updateStatusTime() {
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, '0');
    var mm = String(now.getMinutes()).padStart(2, '0');
    var timeEl = document.getElementById('status-time');
    if (timeEl) timeEl.textContent = hh + ':' + mm;
    setTimeout(updateStatusTime, 60000);
  })();
</script>

</body>
</html>
